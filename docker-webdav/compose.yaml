name: apache-webdav

services:
  webdav:
    build:
      context: .
      args:
        VERSION: local
    image: local/apache-webdav:latest
    restart: unless-stopped
    ports:
      - "${WEBDAV_PORT:-8080}:80"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Tokyo}"
      UMASK: "${UMASK:-022}"
      WEBDAV_AUTH: "${WEBDAV_AUTH:-basic}"
      WEBDAV_USERNAME: "${WEBDAV_USERNAME:-webdav}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD:-}"
      WEBDAV_CHOWN: "${WEBDAV_CHOWN:-true}"
    volumes:
      - ./config:/config
      - ./data:/data
