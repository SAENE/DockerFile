ServerRoot "/etc/apache2"
DefaultRuntimeDir "/run/apache2"
PidFile "/run/apache2/apache2.pid"
Listen 80

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so

# Modules required by /config/webdav.conf.
LoadModule authn_file_module /usr/lib/apache2/modules/mod_authn_file.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule auth_basic_module /usr/lib/apache2/modules/mod_auth_basic.so
LoadModule reqtimeout_module /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule dav_module /usr/lib/apache2/modules/mod_dav.so
LoadModule dav_fs_module /usr/lib/apache2/modules/mod_dav_fs.so
LoadModule autoindex_module /usr/lib/apache2/modules/mod_autoindex.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so

ServerName localhost
ServerAdmin root@localhost

# LinuxServer's init-adduser service applies PUID/PGID to this account before
# Apache starts. The root master binds port 80; request workers run as abc.
User abc
Group abc

ServerTokens Prod
ServerSignature Off
TraceEnable Off
UseCanonicalName Off
UseCanonicalPhysicalPort Off

Timeout 3600
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

TypesConfig /etc/mime.types
EnableMMAP Off
EnableSendfile Off

<Directory "/">
    AllowOverride None
    Require all denied
</Directory>

# Lock state and authentication both live under the /config mount.
DavLockDB "/config/locks/DavLock"

# This endpoint is outside /data and exposes no user content.
Alias "/.webdav-health" "/app/apache-webdav/health/ok"
<Directory "/app/apache-webdav/health">
    AllowOverride None
    Options None
    Require all granted
</Directory>

# Do not impose a request-body timeout or upload size limit on large files.
RequestReadTimeout header=20-40,MinRate=500 body=0
LimitRequestBody 0
DirectoryIndex disabled

# WebDAV has its own independently editable configuration file.
Include "/config/webdav.conf"

# Put additional local overrides in /config/conf.d/*.conf.
IncludeOptional "/config/conf.d/*.conf"
