# Do not impose a request-body timeout or upload size limit on large files.
RequestReadTimeout header=20-40,MinRate=500 body=0
DirectoryIndex disabled

# Lock state and authentication both live under the /config mount.
DavLockDB "/config/locks/DavLock"

# This endpoint is outside /data and exposes no user content.
Alias "/.webdav-health" "/app/apache-webdav/health/ok"
<Directory "/app/apache-webdav/health">
    AllowOverride None
    Options None
    Require all granted
</Directory>

DocumentRoot "/data"
<Directory "/data">
    Dav On
    AllowOverride None
    Options Indexes
    IndexOptions FancyIndexing HTMLTable VersionSort NameWidth=* Charset=UTF-8
    LimitRequestBody 0

    <IfDefine WEBDAV_NO_AUTH>
        Require all granted
    </IfDefine>

    <IfDefine !WEBDAV_NO_AUTH>
        AuthType Basic
        AuthName "WebDAV"
        AuthBasicProvider file
        AuthUserFile "/config/auth/users.htpasswd"
        Require valid-user
    </IfDefine>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</Directory>
